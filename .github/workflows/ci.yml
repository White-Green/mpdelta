name: CI

on: push

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install autoconf automake libtool pkg-config nasm libgtk-3-dev libasound2-dev mesa-vulkan-drivers libvulkan-dev -y

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(yq -p toml -o yaml -er '.toolchain.channel' rust-toolchain.toml)"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy

      - name: Install Rust toolchain for Rust-GPU shader build
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2024-11-22
          components: "rust-src,rustc-dev,llvm-tools-preview"

      - name: Get current month
        id: get-month
        run: |
          echo "month=$(/bin/date -u '+%Y%m')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache cargo registry and index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.get-month.outputs.month }}

      - name: Cargo fetch
        run: cargo +"$TOOLCHAIN_NAME" fetch
        env:
          TOOLCHAIN_NAME: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/
            target_for_shaders/
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.channel }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.channel }}-test-

      - name: Get cargo-vcpkg version
        id: cargo-vcpkg-version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.metadata["cargo-binaries"]["cargo-vcpkg"]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "cargo-vcpkg ${version}"

      - name: Cache cargo-vcpkg
        id: cache-cargo-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-vcpkg
          key: ${{ runner.os }}-cargo-vcpkg-${{ steps.cargo-vcpkg-version.outputs.version }}

      - name: Install cargo-vcpkg if cache miss
        if: steps.cache-cargo-vcpkg.outputs.cache-hit != 'true'
        run: cargo install cargo-vcpkg --version "$CARGO_VCPKG_VERSION" --locked
        env:
          CARGO_VCPKG_VERSION: ${{ steps.cargo-vcpkg-version.outputs.version }}

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('mpdelta_common/mpdelta_ffmpeg/Cargo.toml') }}

      - name: Build FFmpeg with vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cargo vcpkg build --manifest-path mpdelta_common/mpdelta_ffmpeg/Cargo.toml
          echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/x64-linux/lib/pkgconfig" >> "$GITHUB_ENV"
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache

      - name: Run tests
        run: cargo +"$TOOLCHAIN_NAME" test --workspace --locked
        env:
          TOOLCHAIN_NAME: ${{ steps.rust-toolchain.outputs.channel }}

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install autoconf automake libtool pkg-config nasm libgtk-3-dev libasound2-dev -y

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(yq -p toml -o yaml -er '.toolchain.channel' rust-toolchain.toml)"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy

      - name: Install Rust toolchain for Rust-GPU shader build
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2024-11-22
          components: "rust-src,rustc-dev,llvm-tools-preview"

      - name: Get current month
        id: get-month
        run: |
          echo "month=$(/bin/date -u '+%Y%m')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache cargo registry and index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.get-month.outputs.month }}

      - name: Cargo fetch
        run: cargo +"$TOOLCHAIN_NAME" fetch
        env:
          TOOLCHAIN_NAME: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/
            target_for_shaders/
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.channel }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.channel }}-clippy-

      - name: Get cargo-vcpkg version
        id: cargo-vcpkg-version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.metadata["cargo-binaries"]["cargo-vcpkg"]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "cargo-vcpkg ${version}"

      - name: Cache cargo-vcpkg
        id: cache-cargo-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-vcpkg
          key: ${{ runner.os }}-cargo-vcpkg-${{ steps.cargo-vcpkg-version.outputs.version }}

      - name: Install cargo-vcpkg if cache miss
        if: steps.cache-cargo-vcpkg.outputs.cache-hit != 'true'
        run: cargo install cargo-vcpkg --version "$CARGO_VCPKG_VERSION" --locked
        env:
          CARGO_VCPKG_VERSION: ${{ steps.cargo-vcpkg-version.outputs.version }}

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('mpdelta_common/mpdelta_ffmpeg/Cargo.toml') }}

      - name: Build FFmpeg with vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cargo vcpkg build --manifest-path mpdelta_common/mpdelta_ffmpeg/Cargo.toml
          echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/x64-linux/lib/pkgconfig" >> "$GITHUB_ENV"
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache

      - name: Run clippy
        run: cargo +"$TOOLCHAIN_NAME" clippy --workspace --tests --locked -- -D warnings
        env:
          TOOLCHAIN_NAME: ${{ steps.rust-toolchain.outputs.channel }}

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: rustfmt

      - name: Run rustfmt
        run: cargo +nightly fmt --all --check

  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Get taplo-cli version
        id: taplo-version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.metadata["cargo-binaries"]["taplo-cli"]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "taplo-cli ${version}"

      - name: Cache taplo-cli
        id: cache-taplo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/taplo
          key: ${{ runner.os }}-taplo-${{ steps.taplo-version.outputs.version }}

      - name: Install taplo-cli
        if: steps.cache-taplo.outputs.cache-hit != 'true'
        run: cargo install taplo-cli --version "$TAPLO_CLI_VERSION" --locked
        env:
          TAPLO_CLI_VERSION: ${{ steps.taplo-version.outputs.version }}

      - name: Run taplo fmt
        run: taplo fmt --check

  github-actions-lint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GHALINT_VERSION: v1.5.6
      ACTIONLINT_VERSION: v1.7.12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install ghalint and actionlint
        run: |
          go install "github.com/suzuki-shunsuke/ghalint/cmd/ghalint@${GHALINT_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Run actionlint
        run: actionlint -color

      - name: Run zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          version: 1.25.2

      - name: Run ghalint
        if: ${{ !cancelled() }}
        run: ghalint run
        env:
          GHALINT_LOG_COLOR: always
          GITHUB_TOKEN: ${{ github.token }}
