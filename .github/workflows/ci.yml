name: CI

on: push

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt update
          sudo apt install yasm libgtk-3-dev libasound2-dev libopenh264-dev mesa-vulkan-drivers libvulkan-dev -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - id: main_toolchain_version
        run: echo "rustc_version=$(rustc --version | sed -e s/\(.*\)//g)" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-11-22
          components: "rust-src,rustc-dev,llvm-tools-preview"

      - id: get-month
        run: |
          echo "month=$(/bin/date -u "+%Y%m")" >> $GITHUB_OUTPUT
        shell: bash

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.get-month.outputs.month }}

      - uses: actions/cache@v4
        with:
          path: |
            target/
            target_for_shaders/
          key: ${{ runner.os }}-cargo-${{ steps.main_toolchain_version.outputs.rustc_version }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.main_toolchain_version.outputs.rustc_version }}-test-

      - run: cargo +stable test --workspace --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt update
          sudo apt install yasm libgtk-3-dev libasound2-dev libopenh264-dev -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - id: main_toolchain_version
        run: echo "rustc_version=$(rustc --version | sed -e s/\(.*\)//g)" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-11-22
          components: "rust-src,rustc-dev,llvm-tools-preview"

      - id: get-month
        run: |
          echo "month=$(/bin/date -u "+%Y%m")" >> $GITHUB_OUTPUT
        shell: bash

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.get-month.outputs.month }}

      - uses: actions/cache@v4
        with:
          path: |
            target/
            target_for_shaders/
          key: ${{ runner.os }}-cargo-${{ steps.main_toolchain_version.outputs.rustc_version }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.main_toolchain_version.outputs.rustc_version }}-clippy-

      - run: cargo +stable clippy --workspace --tests --locked -- -D warnings

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - id: taplo-version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.metadata["cargo-binaries"]["taplo-cli"]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "taplo-cli ${version}"

      - id: cache-taplo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/taplo
          key: ${{ runner.os }}-taplo-${{ steps.taplo-version.outputs.version }}

      - if: steps.cache-taplo.outputs.cache-hit != 'true'
        run: cargo install taplo-cli --version "$TAPLO_CLI_VERSION" --locked
        env:
          TAPLO_CLI_VERSION: ${{ steps.taplo-version.outputs.version }}

      - run: taplo fmt --check

  github-actions-lint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GHALINT_VERSION: v1.5.6

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - run: go install "github.com/suzuki-shunsuke/ghalint/cmd/ghalint@${GHALINT_VERSION}"

      - id: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          version: 1.25.2

      - if: ${{ !cancelled() }}
        run: ghalint run
        env:
          GHALINT_LOG_COLOR: always
          GITHUB_TOKEN: ${{ github.token }}
