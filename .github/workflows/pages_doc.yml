name: rustdoc pages
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install autoconf automake libtool pkg-config nasm libgtk-3-dev libasound2-dev -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        id: main_toolchain
        with:
          toolchain: nightly
          components: clippy

      - name: Get rustc version
        id: main_toolchain_version
        run: echo "rustc_version=$(rustc --version | sed -e 's/(.*)//g')" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain for Rust-GPU shader build
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2024-11-22
          components: "rust-src,rustc-dev,llvm-tools-preview"

      - name: Get current month
        id: get-month
        run: |
          echo "month=$(/bin/date -u '+%Y%m')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache cargo registry and index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.get-month.outputs.month }}

      - name: Cargo fetch
        run: cargo +nightly fetch

      - name: Cache target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/
            target_for_shaders/
          key: ${{ runner.os }}-cargo-${{ steps.main_toolchain_version.outputs.rustc_version }}-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.main_toolchain_version.outputs.rustc_version }}-doc-

      - id: cargo-vcpkg-version
        run: |
          set -euo pipefail
          version="$(cargo +nightly metadata --no-deps --format-version 1 | jq -er '.metadata["cargo-binaries"]["cargo-vcpkg"]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "cargo-vcpkg ${version}"

      - id: cache-cargo-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-vcpkg
          key: ${{ runner.os }}-cargo-vcpkg-${{ steps.cargo-vcpkg-version.outputs.version }}

      - if: steps.cache-cargo-vcpkg.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-vcpkg --version "$CARGO_VCPKG_VERSION" --locked
        env:
          CARGO_VCPKG_VERSION: ${{ steps.cargo-vcpkg-version.outputs.version }}

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('mpdelta_common/mpdelta_ffmpeg/Cargo.toml') }}

      - name: Build FFmpeg with vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cargo +nightly vcpkg build --manifest-path mpdelta_common/mpdelta_ffmpeg/Cargo.toml
          echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/x64-linux/lib/pkgconfig" >> "$GITHUB_ENV"
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache

      - name: Build documentation
        run: RUSTDOCFLAGS="--enable-index-page" cargo +nightly doc --locked --workspace --document-private-items --no-deps -Zrustdoc-map

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rustdoc
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
